<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NamePlate Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <h1>NamePlate Maker</h1>

    <p class="desc">
        이름을 한 줄에 하나씩 입력하세요.
    </p>

    <textarea id="nameInput" placeholder="김민수&#10;이영희&#10;박철수"></textarea>

    <button id="generateBtn">
        이름표 생성
    </button>

    <button id="pdfBtn">
        PDF 저장
    </button>

    <hr>

    <div id="previewArea">

        미리보기가 여기에 표시됩니다.

    </div>

</div>

<script src="libs/html2canvas.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>

<script src="script.js"></script>

</body>
</html>
